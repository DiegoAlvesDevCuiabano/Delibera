<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Erro #' + ${erro.id})}"></head>
<body class="bg-app">

<nav th:replace="~{fragments/sidebar :: topnav(null)}"></nav>

<main class="dashboard-content" style="margin-left:0;">
  <div class="container-fluid px-4 py-4" style="max-width:900px;">

    <!-- Breadcrumb -->
    <div style="margin-bottom:1rem;">
      <a th:href="@{/root/erros}" style="font-size:0.85rem;color:var(--text-muted);text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i> Voltar aos erros
      </a>
    </div>

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
      <div>
        <h1 style="font-size:1.3rem;font-weight:700;color:var(--text);margin:0;display:flex;align-items:center;gap:0.5rem;">
          <i class="bi bi-bug" style="color:var(--danger);"></i>
          Erro <span th:text="'#' + ${erro.id}">#1</span>
        </h1>
        <p style="font-size:0.88rem;color:var(--danger);font-weight:600;margin:0.25rem 0 0;" th:text="${erro.tipo}">java.lang.NullPointerException</p>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <span th:if="${!erro.resolvido}" class="status-badge" style="background:rgba(239,68,68,0.1);color:#ef4444;padding:0.4rem 1rem;">Pendente</span>
        <span th:if="${erro.resolvido}" class="status-badge" style="background:rgba(16,185,129,0.1);color:#10b981;padding:0.4rem 1rem;">Resolvido</span>
      </div>
    </div>

    <!-- Info Grid -->
    <div class="card-delibera" style="margin-bottom:1.25rem;">
      <div style="padding:1.5rem;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem 2rem;">
          <div>
            <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">URL</span>
            <div style="font-size:0.9rem;font-weight:500;color:var(--text);margin-top:0.2rem;font-family:monospace;" th:text="${erro.metodoHttp + ' ' + erro.url}">GET /foo</div>
          </div>
          <div>
            <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Data/hora</span>
            <div style="font-size:0.9rem;font-weight:500;color:var(--text);margin-top:0.2rem;" th:text="${#temporals.format(erro.criadoEm, 'dd/MM/yyyy ''às'' HH:mm:ss')}">22/04/2026 às 10:30:15</div>
          </div>
          <div>
            <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Usuário</span>
            <div style="font-size:0.9rem;font-weight:500;color:var(--text);margin-top:0.2rem;" th:text="${erro.usuario != null ? erro.usuario : 'Anônimo'}">admin@exemplo.edu.br</div>
          </div>
          <div>
            <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">IP</span>
            <div style="font-size:0.9rem;font-weight:500;color:var(--text);margin-top:0.2rem;" th:text="${erro.ip}">127.0.0.1</div>
          </div>
          <div style="grid-column:1/-1;">
            <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Mensagem</span>
            <div style="font-size:0.9rem;font-weight:500;color:var(--danger);margin-top:0.2rem;line-height:1.6;" th:text="${erro.mensagem != null ? erro.mensagem : 'null'}">Cannot invoke method on null</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stacktrace -->
    <div class="card-delibera" style="margin-bottom:1.25rem;">
      <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);">
        <h2 style="font-size:1rem;font-weight:700;margin:0;color:var(--text);display:flex;align-items:center;gap:0.5rem;">
          <i class="bi bi-terminal" style="color:var(--text-muted);"></i> Stacktrace
        </h2>
      </div>
      <div style="padding:1.25rem 1.5rem;">
        <pre style="margin:0;padding:1rem;background:var(--bg-body);border-radius:var(--radius-xs);font-size:0.72rem;color:var(--text);white-space:pre-wrap;word-wrap:break-word;max-height:500px;overflow-y:auto;border:1px solid var(--border);font-family:'JetBrains Mono',monospace,sans-serif;line-height:1.5;"
             th:text="${erro.stacktrace}">stacktrace...</pre>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:0.75rem;">
      <form th:if="${!erro.resolvido}" th:action="@{/root/erros/{id}/resolver(id=${erro.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="btn btn-submit" style="display:flex;align-items:center;gap:0.4rem;">
          <i class="bi bi-check-circle"></i> Marcar como resolvido
        </button>
      </form>
      <a th:href="@{/root/erros}" class="btn btn-cancel" style="display:flex;align-items:center;gap:0.4rem;">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
