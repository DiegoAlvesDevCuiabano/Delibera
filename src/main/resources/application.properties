# ===== Delibera - Application Properties =====

spring.application.name=Delibera

# ===== Perfil ativo =====
# H2 é o padrão seguro para Run/Debug local. Docker e produção sobrescrevem
# explicitamente por SPRING_PROFILES_ACTIVE=dev|prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===== Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Server =====
server.port=8080
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m

# ===== Upload =====
delibera.upload.dir=${DELIBERA_UPLOAD_DIR:uploads}

# ===== Email =====
delibera.email.enabled=${EMAIL_ENABLED:false}
delibera.email.from=contato@appdelibera.com.br

# ===== Ambiente =====
# Prefixo nos emails: [LOCAL], [DEV], vazio em prod
delibera.ambiente=${DELIBERA_AMBIENTE:LOCAL}
delibera.base-url=${DELIBERA_BASE_URL:http://localhost:8080}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROOT
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# ===== Mail (Zoho SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.zoho.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:contato@appdelibera.com.br}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
