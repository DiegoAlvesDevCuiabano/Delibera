# ===== Delibera — Produção =====

# ===== Banco (Railway PostgreSQL) =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=true

# ===== Email (Zoho SMTP) =====
delibera.email.enabled=${EMAIL_ENABLED:true}
delibera.email.from=${MAIL_FROM:contato@appdelibera.com.br}
spring.mail.host=${MAIL_HOST:smtp.zoho.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:contato@appdelibera.com.br}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:true}

# ===== Ambiente =====
delibera.ambiente=PROD
delibera.base-url=${DELIBERA_BASE_URL:https://appdelibera.com.br}

# ===== Tokens assinados (links de voucher por email) =====
# Sem TOKEN_SECRET a aplicação aborta na inicialização — de propósito: um segredo
# default publicado no repositório tornaria todo token forjável.
delibera.token.secret=${TOKEN_SECRET:}

# ===== Server =====
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Atrás do proxy da plataforma (Railway): faz o Spring resolver esquema/host/IP
# a partir dos headers X-Forwarded-*. Sem isso, IpExtractor enxerga o IP do proxy
# e o rate limiting passa a valer para todos os clientes somados.
server.forward-headers-strategy=framework

# ===== Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
delibera.upload.dir=${UPLOAD_DIR:/app/uploads}

# ===== Logging =====
logging.level.root=WARN
logging.level.com.delibera=INFO
