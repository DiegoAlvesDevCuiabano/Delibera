name: Build & Test

on:
  push:
    branches: [main, develop, prod]
  pull_request:
    branches: [main, develop, prod]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw clean verify -q

      - name: Upload JAR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: delibera-${{ github.ref_name }}
          path: target/*.jar
          retention-days: 7
